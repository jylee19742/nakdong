<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>먹과 함께 놀아요! 수묵화 퀴즈</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:linear-gradient(135deg,#e9f4ff,#fff2d7);min-height:100vh;display:grid;place-items:center;padding:18px;color:#24314b}.app{background:white;border-radius:28px;box-shadow:0 15px 40px #24314b20;max-width:750px;width:100%;padding:clamp(22px,5vw,42px);text-align:center}h1{font-size:clamp(27px,5vw,43px)}h2{font-size:clamp(22px,4vw,31px);line-height:1.5}.tag{color:#1672c8;font-weight:900}.ink{font-size:62px}.meta{display:flex;justify-content:space-between;font-weight:800}.track{background:#e7edf4;height:12px;border-radius:20px;overflow:hidden;margin:18px 0}.fill{background:#3e9cf5;height:100%;transition:width .2s}.choices{display:grid;gap:12px;margin:24px 0}button{font:inherit;font-weight:800;cursor:pointer;border-radius:16px;padding:16px 20px;border:2px solid #c8d7eb;background:#f6faff;color:#24314b;font-size:19px}button:hover:not(:disabled){background:#e6f2ff}button:disabled{cursor:default}button.good{background:#d9f8e3;border-color:#23ad5c}button.bad{background:#ffe2e2;border-color:#e55353}.primary{background:#246cda;color:white;border:0;min-width:170px}.primary:hover{background:#155bc5!important}.feedback{font-weight:800;font-size:19px;min-height:48px;line-height:1.5}.muted{color:#64748b}footer{font-size:13px;color:#64748b;margin-top:25px}</style></head><body><main class="app" id="app"></main><script>
const qs=[
["먹을 갈 때 사용하는 용구는 무엇인가요?",["접시","벼루","서진","깔개"],1,"벼루는 먹을 갈 때 사용하는 용구예요."],
["종이가 움직이지 않도록 고정하는 용구는 무엇인가요?",["접시","깔개","서진","연습지"],2,"서진은 종이를 눌러 고정해요."],
["붓을 사용한 후에는 물로 깨끗이 씻어 붓걸이에 걸어서 말려요.",["O","X"],0,"사용한 붓은 깨끗이 씻고 걸어서 말려요."],
["먹물을 미리 만들어 두면 어떤 점이 좋을까요?",["사용하기 편리해요","종이가 고정돼요","붓이 저절로 말라요","깔개가 필요 없어요"],0,"먹물을 미리 만들어 두면 사용할 때 편리해요."],
["종이가 바닥에 붙지 않도록 사용하는 것은?",["먹","접시","깔개","벼루"],2,"깔개는 종이가 바닥에 붙지 않도록 도와줘요."],
["먹을 갈 때 올바른 방법은?",["먹을 눕혀 빠르게 갈아요","먹을 똑바로 세워 천천히 갈아요","먹을 손으로 부숴요","먹을 종이에 직접 문질러요"],1,"먹은 벼루에 똑바로 세워 천천히 갈아요."],
["먹물의 농담은 무엇을 뜻할까요?",["종이의 길이","붓의 크기","먹물의 진하고 연한 정도","서진의 무게"],2,"농담은 먹물의 진하고 연한 정도예요."],
["연습지는 먹을 갈 때 물을 담아 두는 그릇이에요.",["O","X"],1,"연습지는 먹물로 그림을 그리는 종이예요."],
["먹물의 농담을 조절할 때 사용하는 용구는?",["접시","서진","깔개","붓걸이"],0,"접시를 이용하여 먹물의 농담을 조절해요."],
["수묵화 활동을 마친 뒤 올바른 정리 방법은?",["붓을 먹물에 담가 두어요","붓을 씻지 않고 보관해요","종이로 붓을 세게 문질러요","붓을 물로 깨끗이 씻어 말려요"],3,"붓은 깨끗이 씻어 붓걸이에 걸어 말려요."]
];let i=0,score=0,answered=false;const app=document.getElementById('app');function start(){i=0;score=0;render()}function intro(){app.innerHTML='<div class="ink">🖌️</div><div class="tag">초등학교 3학년 미술</div><h1>먹과 함께 놀아요!</h1><h2>수묵화 재료와 용구 퀴즈</h2><p>총 10문제 · 한 문제당 10점<br>정답을 골라 수묵화 박사가 되어 보세요!</p><button class="primary" id="start">게임 시작하기</button><footer>이름이나 로그인 없이 참여할 수 있어요.</footer>';document.getElementById('start').onclick=start}function render(){answered=false;let q=qs[i];app.innerHTML='<div class="tag">🖌️ 수묵화 퀴즈 도전!</div><div class="meta"><span>문제 '+(i+1)+' / '+qs.length+'</span><span>점수 '+score+'점</span></div><div class="track"><div class="fill" style="width:'+((i)/qs.length*100)+'%"></div></div><h2>'+q[0]+'</h2><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary" id="next" style="display:none">'+(i===qs.length-1?'결과 보기':'다음 문제')+'</button>';const c=document.getElementById('choices');q[1].forEach((label,j)=>{let b=document.createElement('button');b.textContent=(q[1].length===2?'':(j+1)+'. ')+label;b.onclick=()=>choose(j);c.appendChild(b)});document.getElementById('next').onclick=()=>{i++;if(i<qs.length)render();else result()}}function choose(j){if(answered)return;answered=true;const q=qs[i];if(j===q[2])score+=10;[...document.querySelectorAll('#choices button')].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('good');else if(k===j)b.classList.add('bad')});document.getElementById('feedback').textContent=(j===q[2]?'🎉 정답이에요! ':'💡 다시 기억해 봐요! ')+q[3];document.getElementById('next').style.display='inline-block'}function result(){app.innerHTML='<div class="ink">🏆</div><h1>퀴즈 완료!</h1><h2>나의 점수는 '+score+'점 / 100점</h2><p>'+(score===100?'완벽해요! 수묵화 박사!':score>=70?'잘했어요! 수묵화 용구를 잘 알고 있네요.':'수고했어요! 다시 도전해 보세요.')+'</p><button class="primary" id="restart">다시 도전하기</button><footer>정답과 점수는 이 기기에서만 표시됩니다.</footer>';document.getElementById('restart').onclick=start}intro();
</script></body></html>
